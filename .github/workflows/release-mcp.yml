name: Publish @cryptoslip/mcp via npm Trusted Publisher (OIDC)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm CLI for Trusted Publishing (OIDC)
        run: npm install -g npm@latest && npm --version
      - name: Install, test, and build @cryptoslip/sdk & @cryptoslip/mcp
        run: |
          npm ci --prefix packages/sdk --ignore-scripts
          npm run build --prefix packages/sdk
          npm test --prefix packages/sdk
          npm ci --prefix packages/mcp --ignore-scripts
          npm run build --prefix packages/mcp
          npm test --prefix packages/mcp
      - name: Attempt OIDC publish of @cryptoslip/sdk@1.0.1 (if Trusted Publisher enabled)
        id: publish_sdk
        continue-on-error: true
        working-directory: packages/sdk
        run: npm publish --provenance --access public
      - name: Prepare publishable @cryptoslip/mcp@1.0.3 manifest (use @cryptoslip/sdk@1.0.1 or vendor SDK dist)
        run: |
          SDK_VER=$(node -p "require('./packages/sdk/package.json').version")
          if npm view "@cryptoslip/sdk@$SDK_VER" version >/dev/null 2>&1; then
            echo "Verified @cryptoslip/sdk@$SDK_VER on npm — linking dependency."
            SDK_VER="$SDK_VER" node --input-type=commonjs <<'EOF'
          const fs = require('fs');
          const p = 'packages/mcp/package.json';
          const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
          pkg.dependencies['@cryptoslip/sdk'] = process.env.SDK_VER;
          fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          EOF
          else
            echo "@cryptoslip/sdk@$SDK_VER not yet OIDC-configured on npm — vendoring compiled SDK into @cryptoslip/mcp/dist/_vendor_sdk for 100% standalone runtime."
            node --input-type=commonjs <<'EOF'
          const fs = require('fs');
          const path = require('path');
          fs.cpSync('packages/sdk/dist', 'packages/mcp/dist/_vendor_sdk', { recursive: true });
          for (const name of fs.readdirSync('packages/mcp/dist')) {
            const full = path.join('packages/mcp/dist', name);
            if (!fs.statSync(full).isFile()) continue;
            if (!name.endsWith('.js') && !name.endsWith('.d.ts')) continue;
            const src = fs.readFileSync(full, 'utf8');
            const next = src.replace(/(['"])@cryptoslip\/sdk\1/g, "'./_vendor_sdk/index.js'");
            if (next !== src) fs.writeFileSync(full, next);
          }
          const sdkPkg = JSON.parse(fs.readFileSync('packages/sdk/package.json', 'utf8'));
          const mcpPkg = JSON.parse(fs.readFileSync('packages/mcp/package.json', 'utf8'));
          delete mcpPkg.dependencies['@cryptoslip/sdk'];
          for (const [dep, ver] of Object.entries(sdkPkg.dependencies || {})) {
            if (!mcpPkg.dependencies[dep]) mcpPkg.dependencies[dep] = ver;
          }
          fs.writeFileSync('packages/mcp/package.json', JSON.stringify(mcpPkg, null, 2) + '\n');
          EOF
            rm -rf packages/mcp/node_modules/@cryptoslip/sdk
            npm install --prefix packages/mcp --no-package-lock --ignore-scripts --no-audit --no-fund
          fi
      - name: Smoke-test compiled @cryptoslip/mcp CLI entrypoint before publish
        run: |
          node --input-type=commonjs <<'EOF'
          const { spawn } = require('child_process');
          const child = spawn(process.execPath, ['packages/mcp/dist/cli.js'], {
            stdio: ['pipe', 'pipe', 'pipe'],
            env: { ...process.env, CRYPTOSLIP_URL: '' },
          });
          child.stderr.on('data', (d) => process.stderr.write(d));
          let out = '';
          child.stdout.on('data', (c) => {
            out += c.toString();
            if (out.split('\n').filter(Boolean).length >= 2) {
              if (!out.includes('cryptoslip_status')) {
                console.error('Unexpected stdout:', out);
                process.exit(1);
              }
              child.kill();
              process.exit(0);
            }
          });
          child.stdin.write(JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'initialize', params: { protocolVersion: '2024-11-05', capabilities: {}, clientInfo: { name: 'smoke', version: '1.0.3' } } }) + '\n');
          child.stdin.write(JSON.stringify({ jsonrpc: '2.0', method: 'notifications/initialized' }) + '\n');
          child.stdin.write(JSON.stringify({ jsonrpc: '2.0', id: 2, method: 'tools/list', params: {} }) + '\n');
          setTimeout(() => {
            console.error('Smoke test timed out. stdout so far:', out);
            child.kill();
            process.exit(1);
          }, 15000);
          EOF
      - name: Publish @cryptoslip/mcp with npm provenance (OIDC)
        working-directory: packages/mcp
        run: npm publish --provenance --access public
