name: Publish to Official MCP Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server.json'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.10/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Validate & Publish to registry.modelcontextprotocol.io
        run: |
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
